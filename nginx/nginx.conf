# nginx is the single front door: it serves the react app, blocks bots,
# rate limits bad actors and spreads api traffic across the go replicas.

worker_processes auto;
worker_rlimit_nofile 65535;
events {
    worker_connections 16384;   # enough open connections for the spike
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    sendfile      on;
    tcp_nopush    on;
    server_tokens off;
    keepalive_timeout 30s;

    gzip on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # --- real client ip ---------------------------------------------------
    # behind a cdn every request comes from the cdn's ip. trust the forwarded
    # header only from these ranges. in production list your cdn ranges here,
    # never the whole internet.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # --- bot filter -------------------------------------------------------
    # first, cheap layer only. real bot protection (js challenge, device
    # fingerprinting) belongs in the cdn / waf. the signed sale token in the
    # api is the second layer.
    map $http_user_agent $is_bot {
        default 0;
        ""      1;
        ~*(curl|wget|python-requests|python-urllib|scrapy|httpclient|go-http-client|okhttp|headless|phantomjs|selenium|puppeteer|playwright) 1;
    }

    # --- rate limits ------------------------------------------------------
    # too many requests get a fast 429, never a silent drop or a hang.
    limit_req_zone  $binary_remote_addr zone=per_ip:20m   rate=10r/s;
    # per user: keyed on the signed session cookie (a forged cookie is
    # rejected by the api anyway, so it can't be used to dodge the limit)
    limit_req_zone  $cookie_fs_session  zone=per_user:20m rate=2r/s;
    # login and register: password hashing is slow on purpose, so keep
    # guessing attacks slow too (10 tries a minute per ip)
    limit_req_zone  $binary_remote_addr zone=auth_ip:10m  rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=conn_ip:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # --- micro cache for sale status ---------------------------------------
    # 100k browsers polling every second become ~1 request/s to the api.
    proxy_cache_path /var/cache/nginx/status levels=1 keys_zone=status_cache:1m
                     max_size=10m inactive=10s use_temp_path=off;

    # --- load balancing ---------------------------------------------------
    # least_conn sends each request to the replica with the fewest active
    # requests, which beats round robin when some requests are slower.
    upstream api {
        least_conn;
        server api-1:8080 max_fails=3 fail_timeout=5s;
        server api-2:8080 max_fails=3 fail_timeout=5s;
        server api-3:8080 max_fails=3 fail_timeout=5s;
        keepalive 256;          # reuse connections to go, no new tcp per request
    }

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 1s;
    proxy_read_timeout    5s;
    proxy_send_timeout    5s;

    server {
        listen 80 backlog=65535 reuseport;
        root /usr/share/nginx/html;

        # --- react app ----------------------------------------------------
        # file names in /assets contain a content hash, so cache them forever.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
        location = /index.html { add_header Cache-Control "no-cache"; }
        location / { try_files $uri /index.html; }

        # --- sale status (cached for 1 second) -----------------------------
        location = /api/sale/status {
            if ($is_bot) { return 403; }
            limit_req zone=per_ip burst=20 nodelay;
            proxy_cache status_cache;
            proxy_cache_key "sale_status";
            proxy_cache_valid 200 1s;
            proxy_cache_lock on;                         # only one request refills the cache
            proxy_cache_use_stale updating error timeout;
            proxy_ignore_headers Cache-Control;
            add_header X-Cache $upstream_cache_status;
            proxy_pass http://api;
        }

        # --- checkout: the hot path ---------------------------------------
        location = /api/checkout {
            if ($is_bot) { return 403; }
            limit_req  zone=per_ip   burst=20 nodelay;
            limit_req  zone=per_user burst=3  nodelay;
            limit_conn conn_ip 20;
            # posts are normally never retried, but every checkout carries an
            # idempotency key, so retrying on another replica is safe.
            proxy_next_upstream error timeout http_502 http_503 non_idempotent;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 3s;
            proxy_pass http://api;
        }

        # --- login and register: strict limit ------------------------------
        location ~ ^/api/auth/(login|register)$ {
            if ($is_bot) { return 403; }
            limit_req zone=auth_ip burst=5 nodelay;
            client_max_body_size 4k;
            proxy_pass http://api;
        }

        # --- everything else under /api ------------------------------------
        location /api/ {
            if ($is_bot) { return 403; }
            limit_req zone=per_ip burst=40 nodelay;
            proxy_pass http://api;
        }

        location = /nginx-health { access_log off; return 200 "ok"; }
    }
}

# a local "cdn edge". in production this is cloudflare / cloudfront / akamai.
#   static files  -> fetched from s3 (minio here) once, then served from the edge cache
#   /api/sale/status -> cached for 1 second (same answer for everyone)
#   other /api/*  -> passed to the origin nginx gateway, never cached

worker_processes auto;
events { worker_connections 8192; }

http {
    include       /etc/nginx/mime.types;
    sendfile      on;
    server_tokens off;

    gzip on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # log whether each request was a cache HIT or MISS
    log_format edge '$remote_addr "$request" $status cache=$upstream_cache_status $request_time';
    access_log /dev/stdout edge;

    # the edge cache: up to 1 GB on disk, entries kept up to 7 days
    proxy_cache_path /var/cache/nginx/edge levels=1:2 keys_zone=edge:50m
                     max_size=1g inactive=7d use_temp_path=off;

    upstream s3_origin  { server minio:9000;  keepalive 32; }   # static files
    upstream app_origin { server gateway:80;  keepalive 64; }   # api (origin nginx)

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # pass the real client ip on, so the origin rate limits per user, not per cdn
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout    10s;

    server {
        listen 80;

        location = /cdn-health { access_log off; return 200 "ok"; }

        # the home page is index.html in the bucket
        location = / { rewrite ^ /index.html last; }

        # --- static files from s3 ----------------------------------------------
        location / {
            limit_except GET HEAD { deny all; }      # the bucket is read only
            proxy_pass http://s3_origin/static/;     # /assets/x.js -> bucket "static"
            proxy_set_header Host minio:9000;
            proxy_set_header Connection "";

            proxy_cache edge;
            proxy_cache_key $uri;
            proxy_cache_valid 200 10m;               # only if the file has no cache header
            proxy_cache_lock on;                     # 1000 misses at once = 1 origin fetch
            proxy_cache_background_update on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503;

            # hide s3 internals from users
            proxy_hide_header x-amz-request-id;
            proxy_hide_header x-amz-id-2;
            proxy_hide_header x-minio-deployment-id;
            proxy_ignore_headers Set-Cookie;

            # unknown paths (like /orders) get the react app, which handles routing
            proxy_intercept_errors on;
            error_page 403 404 = @spa;

            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Served-By "local-cdn-edge" always;
        }
        location @spa { rewrite ^ /index.html last; }

        # --- sale status: same for everyone, cache 1 second at the edge ---------
        location = /api/sale/status {
            proxy_pass http://app_origin;
            proxy_cache edge;
            proxy_cache_key "sale_status";
            proxy_cache_valid 200 1s;
            proxy_cache_lock on;
            proxy_cache_use_stale updating error timeout;
            proxy_cache_background_update on;
            proxy_ignore_headers Cache-Control Expires;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Served-By "local-cdn-edge" always;
        }

        # --- everything else under /api: per user, never cached ------------------
        location /api/ {
            proxy_pass http://app_origin;
            proxy_cache off;
            add_header X-Served-By "local-cdn-edge" always;
        }
    }
}

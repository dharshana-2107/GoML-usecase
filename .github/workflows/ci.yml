# ci/cd: every push proves the assessment targets still hold.
#   1. backend  - lint + race-detector tests against real redis and postgres
#   2. frontend - lint, build, bundle < 200kb, lighthouse time-to-interactive < 1.5s
#   3. e2e      - full docker stack + k6 rush, then verify exactly 500 sold
#   4. publish  - push images to ghcr (main branch only)
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend - lint and tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-retries 20
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: flashsale }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U app" --health-interval 3s --health-retries 20
    env:
      REDIS_ADDR: localhost:6379
      DATABASE_URL: postgres://app:app@localhost:5432/flashsale?sslmode=disable
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go mod tidy   # creates go.sum if it was not committed yet
      - uses: golangci/golangci-lint-action@v6
        with: { working-directory: backend }
      - name: apply migrations
        run: for f in ../db/migrations/*.sql; do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"; done
      # includes the 5,000-buyer race on the lua script and the 600-order
      # race on the database guard. -race also catches data races.
      - name: tests
        run: go test -race -count=1 -coverprofile=coverage.out ./...

  frontend:
    name: frontend - build, bundle budget, lighthouse
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build          # type check + vite build
      - name: bundle budget (< 200 kb, uncompressed)
        run: |
          BYTES=$(find dist -type f \( -name '*.js' -o -name '*.css' -o -name '*.html' \) -exec cat {} + | wc -c)
          echo "### bundle size: $((BYTES / 1024)) kb (limit 200 kb)" >> "$GITHUB_STEP_SUMMARY"
          [ "$BYTES" -lt 204800 ] || { echo "::error::bundle is over 200 kb"; exit 1; }
      - name: lighthouse (time to interactive < 1.5s)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./frontend/lighthouserc.json
          uploadArtifacts: true

  e2e:
    name: e2e - zero oversell under load
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # fresh random secrets for every run; nothing secret lives in the repo
      - name: create .env with random secrets
        run: |
          echo "SALE_TOKEN_SECRET=$(openssl rand -hex 32)" > .env
          echo "RABBITMQ_PASSWORD=$(openssl rand -hex 16)" >> .env
      - name: start the full stack
        run: docker compose up -d --build --wait
      - name: open the sale now with 500 units
        run: docker compose run --rm seed -stock 500 -start-in 0s
      - name: sign in the load test users
        run: docker compose run --rm -T seed -sessions 10000 > loadtest/sessions.json
      # a ci runner can't make 100k requests in 10s; this proves correctness
      # under heavy contention (20x more buyers than phones). run the full
      # scale capacity test on production-sized machines.
      - name: k6 rush
        run: docker compose --profile loadtest run --rm -e USERS=10000 -e VUS=500 k6
      - name: verify exactly 500 sold
        run: ./scripts/verify-sale.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: k6-summary, path: loadtest/k6-summary.json, if-no-files-found: ignore }
      - name: logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: tear down
        if: always()
        run: docker compose down -v

  publish:
    name: publish images
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        include:
          - { name: api,     context: backend, file: backend/Dockerfile, target: api }
          - { name: worker,  context: backend, file: backend/Dockerfile, target: worker }
          - { name: gateway, context: .,       file: nginx/Dockerfile,   target: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: image name must be lowercase
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.name }}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
